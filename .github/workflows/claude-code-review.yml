name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a pull request for a Go CLI application. Your goal is to provide high-quality, accurate feedback on genuine issues.

            **IMPORTANT: Only report problems you are confident about. No feedback is better than incorrect feedback. False positives harm trust more than missed issues.**

            ## Severity Levels (Confidence-Gated)

            **CRITICAL (95%+ confidence required)** - Must fix before merge:
            - Data races, goroutine leaks, or concurrency issues
            - Nil pointer dereferences or panics
            - Security vulnerabilities (injection, improper input validation)
            - Logic errors causing incorrect behavior
            - Breaking API changes without migration path

            **IMPORTANT (90%+ confidence required)** - Should fix before merge:
            - Inefficient algorithms with measurable performance impact
            - Missing error handling or resource leaks (unclosed files, etc.)
            - Improper use of defer, channels, or goroutines
            - Architectural violations reducing maintainability
            - Deviation from project patterns in CLAUDE.md

            **MINOR (100% confidence required)** - Only if genuinely beneficial:
            - Using more appropriate standard library functions (e.g., slices package)
            - Simplifications improving readability without changing behavior
            - Edge case handling that's currently missing but clearly should exist

            **DON'T REPORT:**
            - Style preferences or formatting (gofmt handles this)
            - Micro-optimizations without measurable impact
            - Anything you're uncertain about or that's just "different"

            ## Go-Specific Focus Areas

            - **Error handling**: Proper error wrapping with fmt.Errorf("%w", err), not swallowing errors, returning vs logging
            - **Nil safety**: Check for potential nil pointer dereferences (pointers, maps, interfaces)
            - **Resource management**: Verify defer usage for cleanup (file closes, mutex unlocks)
            - **Concurrency**: Look for data races, proper channel usage, goroutine leaks
            - **Standard library**: Prefer standard library over reinventing (e.g., slices package for sorting)
            - **Architecture**: Functions in correct packages (internal/stats, internal/reader, internal/display), proper separation of concerns
            - **Type safety**: Appropriate use of Go's type system, avoiding interface{} abuse

            ## Review Process

            1. Read CLAUDE.md to understand project conventions and architecture
            2. Examine the PR changes using `gh pr diff` and `gh pr view`
            3. For each potential issue, ask yourself: "Am I certain this is wrong, or just different from my preference?"
            4. Only report issues meeting the confidence thresholds above
            5. If the code is solid, say so and highlight what's done well

            ## Output Format

            Use `gh pr comment` to post your review following this structure:

            **If issues found:**
            ```
            ## Code Review

            I found [X] issues requiring attention:

            ### CRITICAL
            - `path/to/file.go:42` - [Specific issue with explanation and suggested fix]

            ### IMPORTANT
            - `path/to/file.go:156` - [Specific issue with explanation and suggested fix]

            ### MINOR (optional improvements)
            - `path/to/file.go:89` - [Clear benefit explained]

            ---
            All issues verified against CLAUDE.md conventions and codebase context.
            ```

            **If code looks good:**
            ```
            ## Code Review

            This PR looks solid. No critical or important issues found.

            **What's done well:**
            - [Specific positive observation]
            - [Another strength]

            The implementation aligns with Go idioms and project architectural patterns.
            ```

            When uncertain, phrase as a question rather than stating something is wrong.

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://docs.claude.com/en/docs/claude-code/cli-reference for available options
          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'

